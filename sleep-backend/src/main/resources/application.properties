spring.application.name=sleep-backend

# Database connection — all values must be provided via environment variables in production
spring.datasource.url=jdbc:postgresql://localhost:5432/sleep_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — JWT_SECRET must be set in environment, no default to prevent insecure deployment
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Swagger / OpenAPI — disable in production via env var: SWAGGER_ENABLED=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Logging
logging.level.kz.sleepai.backend=INFO
logging.level.org.springframework.security=DEBUG

# AI service and file storage — override with env variables in production / Docker
app.upload-dir=${UPLOAD_DIR:./uploads}
app.python-script=${PYTHON_SCRIPT_PATH:}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.token=${INTERNAL_API_TOKEN:}
