name: Mobile CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sleep-mobile/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'sleep-mobile/**'

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-mobile

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: sleep-mobile/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint
