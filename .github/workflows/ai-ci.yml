name: AI Microservice CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sleep-ai/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'sleep-ai/**'

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-ai

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: sleep-ai/requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run training script to verify execution
      run: python train_model.py
