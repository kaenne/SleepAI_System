name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sleep-backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'sleep-backend/**'

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-backend

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Make mvnw executable
      run: chmod +x mvnw
    - name: Build and test with Maven
      run: ./mvnw clean test
